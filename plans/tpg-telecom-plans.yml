provider: tpg-telecom
title: Vodafone Business Messaging Hub Plans
generated: '2026-07-25'
method: searched
description: |
  Published commercial plans for the Vodafone Business Messaging Hub — the only
  API-bearing product TPG Telecom sells. Five monthly tiers are listed on the
  Vodafone Australia product page with a fixed plan fee, an included national SMS
  allowance and a per-message overage rate; every tier includes REST API access.
  Add-on pricing (dedicated numbers, lookups, custom link domains) is published in
  the Messaging Hub help centre. All prices exclude GST; a 12-month minimum term and
  a $25 one-off setup fee apply to every tier.
