source: blueprint/tpg-telecom-contacts-management-api.apib
description: >-
  TPG Telecom publishes no Model Context Protocol server, and none is listed in the
  official MCP registry or in the Messaging Hub help centre. One live finding is worth
  recording: the API gateway at api.messaging.tpgtelecom.com.au routes an /mcp prefix
  and answers it with 401 Unauthorized, while unrouted paths on the same host answer
  404 — so something is mounted there behind credentials. Anonymous tools/list is
  rejected, so no tool schema could be read and the route is NOT claimed here as a
  confirmed MCP server. The candidate tool set below is DERIVED from the 18 real
  operations in TPG's published Contacts Management API Blueprint as a proposal for an
  agent-facing surface; it is not published by TPG Telecom.
server: null
transport: null
published: false
probe:
  date: '2026-07-25'
  results:
  - url: https://api.messaging.tpgtelecom.com.au/mcp
    method: GET
    status: 401
    body: '{"message":"Unauthorized"}'
  - url: https://api.messaging.tpgtelecom.com.au/mcp
    method: POST
    request: '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'
    accept: application/json, text/event-stream
    status: 401
    body: '{"message":"Unauthorized"}'
  - url: https://api.messaging.tpgtelecom.com.au/mcp/sse
    status: 401
  - url: https://api.messaging.tpgtelecom.com.au/.well-known/mcp.json
    status: 404
  controls:
  - url: https://api.messaging.tpgtelecom.com.au/randomxyz123
    status: 404
  - url: https://api.messaging.tpgtelecom.com.au/apizzz
    status: 404
  interpretation: >-
    The gateway matches /mcp as a routed prefix (any suffix returns 401) while
    arbitrary paths return 404. Consistent with an auth-gated endpoint mounted at
    /mcp; the protocol spoken there cannot be verified without Messaging Hub
    credentials, and no TPG or Sinch documentation references it.
auth:
  type: http
  schemes: [Basic (api_key:api_secret), HMAC-SHA1]
  detail: authentication/tpg-telecom-authentication.yml
  note: The API has no OAuth surface, so an MCP client would carry a static account key rather than a delegated token.
