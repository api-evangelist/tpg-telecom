actions:
  apisYmlCreated: true
  apisListed: 2
  openapiDirectory: false
  blueprintPath: blueprint/tpg-telecom-contacts-management-api.apib
  reason: >-
    Two real APIs are listed because both are documented and live on TPG-branded hosts.
    No openapi/ directory was created because no OpenAPI or Swagger document exists to
    harvest; the one machine-readable description found is an API Blueprint and is
    stored, verbatim and unconverted, under blueprint/.
