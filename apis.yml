name: TPG Telecom
kind: company
description: >-
  TPG Telecom Limited is Australia's second-largest telecommunications company and
  an ASX-listed mobile network operator and fixed broadband carrier, formed by the
  2020 merger of Vodafone Hutchison Australia and TPG Corporation. It runs its own
  mobile network reaching 98.4% of the Australian population and sells under the
  Vodafone, TPG, iiNet, Internode, Lebara and felix brands, with business, enterprise,
  government and wholesale services consolidated under Vodafone Business. In the
  telecom API value chain TPG Telecom sits squarely on the network side and not the
  developer side: it publishes no first-party developer portal, no downloadable
  OpenAPI, and no network APIs. Its only public, callable developer surface is the
  Vodafone Business Messaging Hub — a white-labelled Sinch MessageMedia (Sinch Engage)
  CPaaS platform running on TPG-branded hosts at messaging.tpgtelecom.com.au and
  api.messaging.tpgtelecom.com.au, with documentation served from a Zendesk help
  centre and an Apiary API Blueprint owned by MessageMedia. On the sector's defining
  signal, CAMARA and GSMA Open Gateway, TPG Telecom is a stated non-participant:
  while Telstra went live with Number Verification and SIM Swap through Aduna and
  Optus signalled it would follow, TPG's public position is that it is "closely
  watching developments like GSMA Open Gateway" while prioritising local scam
  prevention — a watching brief, not an implementation. TPG Telecom is therefore
  partner-gated and aggregator-mediated: developers reach its network through a
  CPaaS supplier, not through TPG.
