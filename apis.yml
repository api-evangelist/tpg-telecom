- aid: tpg-telecom:tpg-telecom-messaging-hub-rest-api
  name: TPG Telecom Messaging Hub REST API
  description: >-
    The SMS/MMS REST API of the Vodafone Business Messaging Hub, listed on the product
    page as "Access to our REST API" on every plan tier. The API is live on the
    TPG-branded host https://api.messaging.tpgtelecom.com.au — anonymous probes on
    2026-07-25 returned HTTP 401 Unauthorized (route present, credentials required)
    for /v1/messages, /v1/replies, /v1/delivery_reports and /v1/webhooks, while
    unrouted paths returned 404. Credentials are issued from the Messaging Hub console
    as REST Basic, REST HMAC, or legacy username/password keys. The full reference is
    not published as a first-party developer portal; the platform is a white-labelled
    Sinch MessageMedia deployment and the help centre's "API Documentation" article is
    served behind a Cloudflare bot challenge. No OpenAPI, Swagger, AsyncAPI, Postman
    collection, GraphQL surface, or first-party SDK was found.
  humanURL: https://support.messaging.tpgtelecom.com.au/hc/en-us/sections/4750925238671-REST-API-Documentation
  baseURL: https://api.messaging.tpgtelecom.com.au
