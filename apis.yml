apis:
- aid: tpg-telecom:tpg-telecom-messaging-hub-contacts-api
  name: TPG Telecom Messaging Hub Contacts API
  description: >-
    Contacts Management API for the Vodafone Business Messaging Hub, providing CRUD
    over contacts, lists and custom fields for SMS/MMS campaigns. Documented as an
    Apiary API Blueprint (project subdomain contactsapiv1tgp, owner "MessageMedia")
    embedded in the TPG Telecom Messaging Hub help centre. The blueprint declares the
    base URI https://api.messaging.tpgtelecom.com.au and 18 operations across
    /api/v1/contacts/contacts, /api/v1/contacts/lists and /api/v1/contacts/custom-fields.
    Authentication is HTTP Basic (Base64 api_key:api_secret) or an hmac-sha1 signed
    Authorization header. No OpenAPI or Swagger document is published — the Apiary
    project's description format is apiblueprint, and its swagger.json endpoint returns
    project metadata only.
  humanURL: https://contactsapiv1tgp.docs.apiary.io/
  baseURL: https://api.messaging.tpgtelecom.com.au
  tags:
  - Contacts
  - Messaging
  - CPaaS
  properties:
  - type: APIBlueprint
    url: blueprint/tpg-telecom-contacts-management-api.apib
  - type: APIReference
    url: https://contactsapiv1tgp.docs.apiary.io/
  - type: Documentation
    url: https://support.messaging.tpgtelecom.com.au/hc/en-us/articles/11469281100559-Contacts-API
  - type: Documentation
    url: https://support.messaging.tpgtelecom.com.au/hc/en-us/sections/4750925238671-REST-API-Documentation
  - type: Authentication
