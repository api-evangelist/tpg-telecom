description: >-
  TPG Telecom publishes no client libraries of its own. github.com/tpgtelecom exists as
  "TPG Telecom Limited" with zero public repositories, and no package on any registry
  is authored by TPG Telecom or Vodafone Australia. Because the Messaging Hub is a
  white-labelled Sinch MessageMedia deployment, the libraries a Messaging Hub customer
  would actually reach for are MessageMedia's — recorded below as third-party context
  with official set to false, since they are first-party to the vendor, not to TPG, and
  they target the vendor's own host rather than api.messaging.tpgtelecom.com.au.
